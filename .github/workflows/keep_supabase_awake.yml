name: Keep Supabase Awake

on:
  schedule:
    # A cada 6 dias à meia-noite (00:00 UTC)
    - cron: "0 0 */6 * *"
  workflow_dispatch: # Permite rodar manualmente

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase REST API (evitar hibernação do banco)
        run: |
          echo "Enviando requisição para manter o banco ativo..."
          curl -s -w "\nStatus: %{http_code}\n" \
            "https://naoqyfuvfqwdckbjemvw.supabase.co/rest/v1/" \
            -H "apikey: ${{ secrets.SUPABASE_SECRET_KEY }}" \
            -H "Authorization: Bearer ${{ secrets.SUPABASE_SECRET_KEY }}" \
            --max-time 30
          echo "Banco mantido com sucesso!"

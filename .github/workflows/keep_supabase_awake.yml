name: Keep Supabase Awake

on:
  schedule:
    # A cada 6 dias à meia-noite (00:00 UTC)
    - cron: "0 0 */6 * *"
  workflow_dispatch: # Permite rodar manualmente

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase (evitar hibernação)
        run: |
          echo "Enviando requisição para manter o banco ativo..."
          curl -s -o /dev/null -w "Status: %{http_code}\n" \
            "https://naoqyfuvfqwdckbjemvw.supabase.co/rest/v1/" \
            -H "apikey: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZmVyZW5jZSI6InB1YmxpYyIsInJvbGUiOiJhbm9uIiwiaWF0IjoxNjQ5NjQzMjAwLCJleHAiOjE5NjUyMTkyMDB9.ZqYm5ZqYm5ZqYm5ZqYm5ZqYm5ZqYm5ZqYm5ZqYm5Z" \
            -H "Authorization: Bearer eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZmVyZW5jZSI6InB1YmxpYyIsInJvbGUiOiJhbm9uIiwiaWF0IjoxNjQ5NjQzMjAwLCJleHAiOjE5NjUyMTkyMDB9.ZqYm5ZqYm5ZqYm5ZqYm5ZqYm5ZqYm5ZqYm5ZqYm5Z" \
            --max-time 30
          echo "Banco mantido com sucesso!"
